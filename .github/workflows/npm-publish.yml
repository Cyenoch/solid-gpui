name: Publish npm packages

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  packages:
    name: Verify and pack release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Set up Node for npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Use pinned OIDC-capable npm
        run: npm install --global npm@11.19.0

      - name: Validate committed release identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/npm-release.ts check "$RELEASE_TAG"

      - name: Set up pinned Rust for host-export fixtures
        run: rustup show active-toolchain

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Check packages and packed consumers
        run: bun run task package-ci

      - name: Audit npm dependencies
        run: bun audit

      - name: Pack verified npm archives
        run: |
          mkdir -p "$RUNNER_TEMP/npm-release"
          for package in solid-gpui solid-gpui-vite solid-gpui-router solid-gpui-shiki; do
            (cd "packages/$package" && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-release")
          done

      - name: Retain verified packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release/*.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish verified packages through npm OIDC
    needs: packages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release metadata and publisher
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Set up Node for npm
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Use pinned OIDC-capable npm
        run: npm install --global npm@11.19.0

      - name: Download this run's verified packages
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release

      - name: Publish core and integrations
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bun scripts/npm-release.ts publish "$RELEASE_TAG" "$RUNNER_TEMP/npm-release"
