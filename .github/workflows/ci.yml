name: CI

on:
  push:
    branches: [main]
    paths: &ci-paths
      - ".github/**"
      - ".bun-version"
      - ".cargo/**"
      - ".oxfmtrc.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "crates/**"
      - "vendor/**"
      - "third_party/**"
      - "packages/**"
      - "examples/**"
      - "fixtures/**"
      - "scripts/**"
  pull_request:
    paths: *ci-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  native:
    name: Native ${{ matrix.lane }} (macOS)
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        lane: [check, test]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Set up Rust and dependency cache
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-native-${{ matrix.lane }}-macos-15

      - name: Install Bun workspace
        run: bun install --frozen-lockfile

      - name: Check native contracts and feature configurations
        if: matrix.lane == 'check'
        run: bun run task native-check-ci

      - name: Test protocol and native runtimes
        if: matrix.lane == 'test'
        run: bun run task native-test-ci

  packages:
    name: Package checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .bun-version

      # These fixtures have no registry build dependencies or reusable target tree.
      - name: Set up pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install Bun workspace
        run: bun install --frozen-lockfile

      - name: Check packages, formatting, types, and tests
        run: bun run task package-ci

  checks:
    name: Rust and Bun checks
    needs: [native, packages]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fail unless every native lane and package checks succeeded
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          PACKAGES_RESULT: ${{ needs.packages.result }}
        run: |
          printf 'native=%s packages=%s\n' "$NATIVE_RESULT" "$PACKAGES_RESULT"
          if [ "$NATIVE_RESULT" != "success" ] || [ "$PACKAGES_RESULT" != "success" ]; then
            printf '::error::every native lane and the package checks must succeed\n'
            exit 1
          fi
