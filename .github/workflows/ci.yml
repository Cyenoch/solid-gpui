name: CI

on:
  push:
    branches: [main]
    paths: &ci-paths
      - ".github/**"
      - ".bun-version"
      - ".cargo/**"
      - ".oxfmtrc.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "bun.lock"
      - "tsconfig*.json"
      - "crates/**"
      - "vendor/**"
      - "third_party/**"
      - "packages/**"
      - "examples/**"
      - "fixtures/**"
      - "scripts/**"
  pull_request:
    paths: *ci-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  checks:
    name: Rust and Bun checks
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Set up Rust and dependency cache
        uses: ./.github/actions/setup-rust
        with:
          cache-key: ci-macos-15

      - name: Install Bun workspace
        run: bun install --frozen-lockfile

      - name: Check generated contracts, formatting, types, and tests
        run: bun run ci
