name: Host Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-release-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  host-release-candidate:
    name: Build and verify process-runtime host bundle
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # The notices check uses the last dependency change date.

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Install Bun workspace
        run: bun install --frozen-lockfile

      - name: Set up Rust and dependency cache
        uses: ./.github/actions/setup-rust
        with:
          cache-key: host-candidate-macos-15

      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Audit candidate dependencies and notices
        run: bun run audit

      - name: Run development checks before bundling
        run: bun run ci

      - name: Smoke extracted candidate with user renderer
        run: bun run task host-candidate-smoke

      - name: Upload candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solid-gpui-host-candidate-${{ github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
