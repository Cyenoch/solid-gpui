name: Host Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: host-release-candidate-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  host-release-candidate:
    name: Build and verify process-runtime host bundle
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run full CI gate before bundling
        run: make ci

      - name: Build and verify release bundle
        run: make host-release-check

      - name: Smoke extracted candidate with user renderer
        run: make host-candidate-smoke

      - name: Upload candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: react-gpui-host-candidate-${{ github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
