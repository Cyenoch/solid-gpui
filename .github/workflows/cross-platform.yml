name: Cross-platform host

on:
  push:
    branches: [main]
    paths: &host-paths
      - ".github/workflows/cross-platform.yml"
      - ".github/actions/setup-rust/**"
      - ".bun-version"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "package.json"
      - "bun.lock"
      - "crates/**"
      - "vendor/**"
      - "third_party/**"
      - "examples/*/native/**"
      - "packages/**"
      - "fixtures/**"
      - "scripts/**"
  pull_request:
    paths: *host-paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-platform-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux host checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned Bun for renderer fixtures
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Install Bun workspace
        run: bun install --frozen-lockfile

      - name: Install Linux host build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfontconfig1-dev \
            libfreetype6-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config

      - name: Set up Rust and dependency cache
        uses: ./.github/actions/setup-rust
        with:
          cache-key: cross-platform-ubuntu-24.04

      # Embedded Bun is intentionally excluded: its build script requires macOS JavaScriptCore.
      - name: Check Linux workspace with Clippy
        run: cargo clippy --workspace --exclude solid-gpui-bun-sys --all-targets --locked -- -D warnings

      - name: Test library and Bun renderer fixtures
        run: cargo test -p solid-gpui -p gpui-pre-reqwest-client --lib --locked

      # TODO: Add a bounded Xvfb/Wayland display-backed renderer smoke once the runner
      # compositor, GPU, portal, and font prerequisites are pinned and proven stable.

  windows:
    name: Windows host build
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Rust and dependency cache
        uses: ./.github/actions/setup-rust
        with:
          cache-key: cross-platform-windows-2022

      # Embedded Bun is intentionally excluded: its build script requires macOS JavaScriptCore.
      - name: Check Windows workspace
        run: cargo check --workspace --exclude solid-gpui-bun-sys --locked

      # The hosted Windows image carries the MSVC toolchain and Windows SDK; the
      # build also exercises gpui_windows' fxc.exe shader compiler lookup.
      - name: Build process-mode host
        run: cargo build -p solid-gpui --bin solid-gpui-host --locked
