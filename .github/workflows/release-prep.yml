name: Release Prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Strict MAJOR.MINOR.PATCH version with a matching CHANGELOG section"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-prep-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  release-prep:
    name: Candidate version and package verification
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Cache release Bun installs
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version', 'bun.lock') }}-release
          restore-keys: |
            bun-${{ runner.os }}-${{ runner.arch }}-release-

      - name: Install Bun workspace
        run: bun install --frozen-lockfile

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      - name: Synchronize candidate version and frozen locks
        run: bun run task release-prep "$RELEASE_VERSION"

      - name: Run complete candidate CI gate
        run: bun run ci

      - name: Pack core candidate (no publish)
        run: bun run task package-pack "$RUNNER_TEMP/solid-gpui-core-$RELEASE_VERSION.tgz"

      - name: Pack router candidate (no publish)
        run: bun run task router-package-pack "$RUNNER_TEMP/solid-gpui-router-$RELEASE_VERSION.tgz"

      - name: Pack Shiki candidate (no publish)
        run: bun run task shiki-package-pack "$RUNNER_TEMP/solid-gpui-shiki-$RELEASE_VERSION.tgz"

      - name: Verify candidate package tarballs
        run: |
          test -s "$RUNNER_TEMP/solid-gpui-core-$RELEASE_VERSION.tgz"
          test -s "$RUNNER_TEMP/solid-gpui-router-$RELEASE_VERSION.tgz"
          test -s "$RUNNER_TEMP/solid-gpui-shiki-$RELEASE_VERSION.tgz"

      - name: Upload candidate package tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solid-gpui-release-prep-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/solid-gpui-core-*.tgz
            ${{ runner.temp }}/solid-gpui-router-*.tgz
            ${{ runner.temp }}/solid-gpui-shiki-*.tgz
          if-no-files-found: error
          retention-days: 7
