name: Release Prep

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Strict MAJOR.MINOR.PATCH version with a matching CHANGELOG section"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-prep-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  release-prep:
    name: Candidate version and package verification
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # The notices check uses the last dependency change date.

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Set up Rust and dependency cache
        uses: ./.github/actions/setup-rust
        with:
          cache-key: release-prep-macos-15

      - name: Install Bun workspace
        run: bun install --frozen-lockfile

      - name: Install pinned cargo-deny
        uses: taiki-e/install-action@d438492cf8a250514fa2d34b30bc3c0dc37c65ff # v2.87.8
        with:
          tool: cargo-deny@0.20.2
          fallback: none

      - name: Synchronize candidate version and frozen locks
        run: bun run task release-prep "$RELEASE_VERSION"

      - name: Audit candidate dependencies and notices
        run: bun run audit

      - name: Run candidate development checks
        run: bun run ci

      - name: Pack core candidate (no publish)
        run: bun run task package-pack "$RUNNER_TEMP/solid-gpui-core-$RELEASE_VERSION.tgz"

      - name: Pack router candidate (no publish)
        run: bun run task router-package-pack "$RUNNER_TEMP/solid-gpui-router-$RELEASE_VERSION.tgz"

      - name: Pack Shiki candidate (no publish)
        run: bun run task shiki-package-pack "$RUNNER_TEMP/solid-gpui-shiki-$RELEASE_VERSION.tgz"

      - name: Upload candidate package tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: solid-gpui-release-prep-${{ inputs.version }}
          path: |
            ${{ runner.temp }}/solid-gpui-core-*.tgz
            ${{ runner.temp }}/solid-gpui-router-*.tgz
            ${{ runner.temp }}/solid-gpui-shiki-*.tgz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
