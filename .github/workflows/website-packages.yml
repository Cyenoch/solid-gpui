name: Website Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (blank uploads candidates only)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: website-packages-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package Website on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - name: Preserve source bytes when checking out release tags
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Validate release identity
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: bun scripts/npm-release.ts check "$RELEASE_TAG"
        shell: bash

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libfontconfig1-dev libfreetype6-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev pkg-config

      - name: Set up Rust and dependency cache
        uses: ./.github/actions/setup-rust
        with:
          cache-key: website-package-${{ matrix.os }}

      - name: Install Bun workspace
        run: bun install --frozen-lockfile

      - name: Build and verify extracted native application
        run: bun run task website-package

      - name: Upload application candidate and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/website/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish Gallery Desktop assets
    needs: package
    if: github.event_name == 'push' || inputs.tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download verified application archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4.3.0
        with:
          pattern: website-*
          merge-multiple: true
          path: packages

      - name: Verify all platforms and publish release assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ && "$RELEASE_TAG" != v0.0.0 ]]
          version="${RELEASE_TAG#v}"
          cd packages
          assets=()
          for target in aarch64-apple-darwin x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            extension=zip
            if [[ "$target" == x86_64-unknown-linux-gnu ]]; then extension=tar.gz; fi
            archive="solid-gpui-website-$version-$target.$extension"
            sha256sum --check "$archive.sha256"
            assets+=("$archive" "$archive.sha256")
          done
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Solid GPUI $RELEASE_TAG" --generate-notes \
              --notes 'Gallery Desktop is the native website application with an embedded QuickJS runtime; no Bun or Node installation is required. Download the archive for your platform and its SHA-256 file. macOS: Apple Silicon, ad hoc signed (not notarized). Linux: x86-64, built on Ubuntu 24.04, requires system libraries and a working graphics stack. Windows: x86-64, unsigned. Archives pass extraction, version and embedded UI checks; interactive desktop testing is still required.'
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
