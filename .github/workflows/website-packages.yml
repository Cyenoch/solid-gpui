name: Website Packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/website-packages.yml"
      - "scripts/**"
      - "examples/website/**"
      - "packages/**"
      - "crates/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package.json"
      - "bun.lock"
      - ".bun-version"
      - "rust-toolchain.toml"
      - "LICENSE"
      - "THIRD-PARTY-NOTICES.md"
      - "docs/distribution.md"

permissions:
  contents: read

concurrency:
  group: website-packages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package Website on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libfontconfig1-dev libfreetype6-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev pkg-config

      - name: Cache Rust build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: website-package-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            website-package-${{ runner.os }}-${{ runner.arch }}-

      - name: Build and verify extracted native application
        run: bun run task website-package

      - name: Upload application candidate and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: website-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          path: dist/website/*
          if-no-files-found: error
          retention-days: 7
