name: Embedded Bun

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".bun-version"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/react-gpui/**"
      - "crates/react-gpui-bun/**"
      - "crates/react-gpui-host/**"
      - "packages/react-gpui/**"
      - "packages/react-gpui-dev/**"
      - "rust-toolchain.toml"
      - ".github/workflows/embedded-bun.yml"

permissions:
  contents: read

concurrency:
  group: embedded-bun-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  embedded-bun:
    name: Build embedded Bun on macOS ARM
    runs-on: macos-26 # Bun/JSC embedding requires the macOS 26 SDK/toolchain
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version-file: .bun-version

      - name: Cache embedded Bun build
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: embedded-bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.bun-version', 'crates/react-gpui-bun/build.rs', 'crates/react-gpui-bun/bun_embed.patch') }}
          restore-keys: |
            embedded-bun-${{ runner.os }}-${{ runner.arch }}-

      - name: Check embedded Bun build
        run: make embedded-bun
