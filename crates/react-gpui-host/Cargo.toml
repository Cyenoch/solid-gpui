[package]
name = "react-gpui-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native GPUI host for running React GPUI renderer entries."
readme = "../../README.md"
[features]
default = []
embedded-bun = ["dep:react-gpui-bun", "react-gpui-bun/embedded-bun"]

[dependencies]
futures.workspace = true
gpui.workspace = true
gpui-platform = { git = "https://github.com/zed-industries/zed", rev = "6805d952f9f3d702f760aa11b1547df8a625fa16", package = "gpui_platform", features = ["font-kit", "test-support"] }
react-gpui-bun = { path = "../react-gpui-bun", optional = true }
react-gpui = { path = "../react-gpui" }
[target.'cfg(target_os = "linux")'.dependencies]
gpui-platform = { git = "https://github.com/zed-industries/zed", rev = "6805d952f9f3d702f760aa11b1547df8a625fa16", package = "gpui_platform", features = ["font-kit", "wayland", "x11"] }



[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }