[package]
name = "solid-gpui-macros"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Rust authoring macros for Solid GPUI native components and commands"

[lib]
proc-macro = true

[dependencies]
heck = "0.5"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12.0.1"
