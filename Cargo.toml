[workspace]
resolver = "2"
members = [
    "examples/website/native",
    "examples/native-migration/native",
    "crates/solid-gpui",
    "crates/solid-gpui-web",
    "crates/solid-gpui-macros",
    "crates/solid-gpui-bun-sys",
    "crates/gpui-iconify",
    "crates/gpui-performance",
]
exclude = ["references/zed", "references/gpui-component", "vendor/gpui-component"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.3.0"
description = "Solid GPUI renders Solid trees into one or more native GPUI surfaces."
keywords = ["solid", "gpui", "native-ui"]
categories = ["gui"]

repository = "https://github.com/Cyenoch/solid-gpui"
readme = "README.md"

[workspace.dependencies]
bebop = "3.2.3"
futures = "0.3"
gpui = { package = "gpui-pre", version = "0.3.3" }
gpui-platform = { package = "gpui-pre-platform", version = "0.3.3" }
gpui-component = { path = "vendor/gpui-component/crates/component" }
gpui-base = { path = "vendor/gpui-component/crates/base" }
gpui-kit-assets = { path = "vendor/gpui-component/crates/assets" }
serde = { version = "1.0", features = ["derive"] }
skrifa = { version = "0.46.2", default-features = false, features = ["std"] }
thiserror = "2.0"
unicode-segmentation = "1.13.3"
serde_json = "1.0"

[profile.dev]
debug = 1

# Keep native layout and scene construction optimized during iterative app development.
[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.taffy]
opt-level = 3

# Taffy's node-key conversions otherwise cross into unoptimized slotmap code.
[profile.dev.package.slotmap]
opt-level = 3

# The interpreter's C stack and execution cost also affect ordinary debug UI runs.
[profile.dev.package.rquickjs-sys]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[patch.crates-io]
gpui-pre-reqwest-client = { path = "vendor/gpui-reqwest-client" }
gpui-pre = { path = "vendor/gpui" }
gpui-pre-web = { path = "vendor/gpui-web" }
gpui-pre-wgpu = { path = "vendor/gpui-wgpu" }
