[workspace]
resolver = "2"
members = [
    "crates/react-gpui",
    "crates/react-gpui-host",
    "crates/react-gpui-bun",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
futures = "0.3"
gpui = "0.2.2"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
thiserror = "2.0"
[patch.crates-io]
gpui = { git = "https://github.com/zed-industries/zed", rev = "6805d952f9f3d702f760aa11b1547df8a625fa16", package = "gpui", version = "=0.2.2" }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
