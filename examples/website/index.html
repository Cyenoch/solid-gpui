<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Solid GPUI — fine-grained SolidJS, rendered by Rust GPUI. Explore components and interactive documentation in English and Chinese."
    />
    <title>Solid GPUI — Native apps with Solid</title>
    <link rel="stylesheet" href="/src/base.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png" />
    <noscript>
      <style>
        #status {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="status" role="status" aria-atomic="true" lang="en">
      <div class="startup-content">
        <img class="startup-mark" src="/brand/icon-180.png" width="80" height="80" alt="" />
        <h1 class="startup-title">Solid GPUI</h1>
        <p class="startup-tagline">Native apps, built with Solid.</p>
        <div class="startup-progress" aria-hidden="true"><span></span></div>
        <p class="startup-label">Loading your experience…</p>
      </div>
    </div>
    <template id="startup-error">
      <section class="startup-error" aria-labelledby="startup-error-title">
        <div class="startup-brand"><img src="/brand/icon-32.png" width="28" height="28" alt="" />Solid GPUI</div>
        <div class="compatibility-symbol" aria-hidden="true">
          <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
            <rect x="6" y="9" width="44" height="35" rx="6" stroke="currentColor" stroke-width="2" />
            <path
              d="M6 20h44M13 15h1m5 0h1M28 27v6m0 5v1"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </div>
        <p class="startup-eyebrow">A small pause before we begin</p>
        <h1 id="startup-error-title" class="startup-title">Browser not supported</h1>
        <p class="startup-description" data-description></p>
        <div class="startup-guidance">
          <span class="startup-step" aria-hidden="true">↗</span>
          <p data-guidance></p>
        </div>
        <div class="startup-actions">
          <button type="button">Try again <span aria-hidden="true">↻</span></button>
          <a href="https://github.com/cyenoch/solid-gpui/blob/main/docs/getting-started.md"
            >Read the docs <span aria-hidden="true">↗</span></a
          >
        </div>
        <details class="startup-details">
          <summary>Technical details</summary>
          <pre data-details></pre>
        </details>
        <p class="startup-footnote">Native ideas. A different way to build.</p>
      </section>
    </template>
    <noscript class="startup-noscript" lang="en">Enable JavaScript to explore Solid GPUI.</noscript>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
